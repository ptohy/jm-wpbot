services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: jmwpbot
      POSTGRES_USER: jmwpbot
      POSTGRES_PASSWORD: change-me
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      - postgres
    ports:
      - "3000:3000"
volumes:
  postgres_data:
